name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Fail here, with a clear message, if the runner has no Chrome. The scraper
      # tests fail in CI without it too; they only skip on a developer's machine.
      - run: google-chrome --version
      - run: npm test
